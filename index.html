<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makeup by Mila - Professional MUA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts untuk tipografi yang elegan dan mewah -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Tema Cream Beige & Warm Luxury */
        .bg-cream-soft { background-color: #fcfbf9; }
        .bg-cream-card { background-color: #f4f0ea; }
        .bg-cream-dark { background-color: #d4c5b9; }
        .beige-btn { background-color: #bfa181; }
        .beige-btn:hover { background-color: #a38768; }
        .text-beige-dark { color: #5c4d42; }
        .text-beige-primary { color: #8c7355; }
        .border-beige { border-color: #e6dfd5; }
        
        .active-menu { color: #8c7355 !important; border-top: 2px solid #8c7355; }

        /* Font khusus untuk judul agar estetik ala MUA */
        .font-brand {
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 0.05em;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-stone-100 font-sans">

    <div class="max-w-md mx-auto bg-cream-soft min-h-screen shadow-2xl flex flex-col relative pb-24">
        
        <!-- HEADER UTAMA -->
        <header class="p-6 text-center bg-cream-card border-b border-beige flex flex-col items-center">
            <!-- Logo dari Google Drive -->
            <div class="w-16 h-16 rounded-full overflow-hidden mb-2 border border-beige shadow-sm bg-white flex items-center justify-center">
                <img src="https://lh3.googleusercontent.com/d/1qHUPMOwfyAl8TwEh3X_pCzNdvyJdtFS9" alt="Logo Makeupbymila" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
            </div>
            <!-- Font Brand Dipercantik -->
            <h1 class="text-3xl font-bold text-beige-dark font-brand tracking-wider">Makeupbymila</h1>
            <p class="text-xs text-beige-primary italic mt-1 font-serif">"Make your perfect on a special day"</p>
        </header>

        <!-- AREA KONTEN UTAMA (Dinamis) -->
        <main id="contentArea" class="p-6 flex-grow">
            <!-- Konten dimuat lewat JavaScript -->
        </main>

        <!-- WATERMARK NAMA SANTIKA -->
        <div class="text-center py-2 text-[10px] tracking-widest text-beige-dark/40 font-serif">
            Created with love by Santika for Makeupbymila
        </div>

        <!-- NAVIGASI BAWAH -->
        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-beige flex justify-between items-center px-4 py-3 shadow-[0_-5px_10px_rgba(0,0,0,0.05)] z-50">
            <button onclick="loadPage('home', this)" class="nav-btn flex flex-col items-center text-beige-dark active-menu p-1">
                <i class="fa-solid fa-house text-lg"></i><span class="text-[9px] font-bold mt-1">HOME</span>
            </button>
            <button onclick="loadPage('pricelist', this)" class="nav-btn flex flex-col items-center text-gray-400 p-1">
                <i class="fa-solid fa-tags text-lg"></i><span class="text-[9px] font-bold mt-1">PRICELIST</span>
            </button>
            
            <!-- TOMBOL TENGAH (Booking) -->
            <button onclick="loadPage('booking', this)" class="nav-btn flex flex-col items-center -mt-7 beige-btn text-white p-3.5 rounded-full shadow-lg border-4 border-white">
                <i class="fa-solid fa-calendar-check text-xl"></i>
            </button>
            
            <button onclick="loadPage('galeri', this)" class="nav-btn flex flex-col items-center text-gray-400 p-1">
                <i class="fa-solid fa-images text-lg"></i><span class="text-[9px] font-bold mt-1">GALERI</span>
            </button>
            <button onclick="loadPage('produk', this)" class="nav-btn flex flex-col items-center text-gray-400 p-1">
                <i class="fa-solid fa-wand-magic-sparkles text-lg"></i><span class="text-[9px] font-bold mt-1">PRODUK</span>
            </button>
        </nav>
    </div>

    <script>
        function loadPage(page, element) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active-menu', 'text-beige-dark'));
            if(element) element.classList.add('active-menu', 'text-beige-dark');

            const content = document.getElementById('contentArea');
            
            if (page === 'home') {
                content.innerHTML = `
                    <div class="text-center py-4">
                        <!-- Foto Profil dari Google Drive -->
                        <div class="w-32 h-32 mx-auto rounded-full bg-cream-card border-4 border-beige flex items-center justify-center mb-4 overflow-hidden shadow-md">
                            <img src="https://lh3.googleusercontent.com/d/1bpFAvwX4pko9SJhjCrB_29iEH7eA_BqF" alt="Foto Profil Mila" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                        </div>
                        <h2 class="text-2xl font-bold text-beige-dark font-brand">Professional MUA</h2>
                        <p class="text-beige-primary text-sm mt-1">Siap mempercantik hari spesialmu dengan hasil yang manglingi dan tahan lama.</p>
                        
                        <div class="mt-6 bg-cream-card p-4 rounded-2xl border border-beige text-left shadow-sm">
                            <h3 class="font-bold text-beige-dark text-sm mb-1 font-serif"><i class="fa-solid fa-gift text-beige-primary mr-2"></i>Special Gift (Paket Premium):</h3>
                            <p class="text-xs text-beige-dark leading-relaxed">Free Softlens Normal (Candy Brown / OMG Brown), lengkap dengan Makeup Touch Up Kit Mini.</p>
                        </div>
                        <button onclick="loadPage('booking')" class="mt-6 w-full beige-btn text-white py-3 rounded-xl font-bold shadow-md">Booking Jadwal Sekarang</button>
                    </div>`;
            } else if (page === 'pricelist') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold text-beige-dark mb-4 font-brand">Pricelist & Paket</h2>
                    <div class="space-y-4">
                        <div class="bg-cream-card p-4 rounded-2xl border border-beige shadow-sm">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-beige-dark font-serif">PAKET REGULER</span>
                                <span class="bg-[#bfa181] text-white text-xs px-2.5 py-1 rounded-full font-bold">Rp 100k - 130k</span>
                            </div>
                            <ul class="text-xs text-beige-dark space-y-1.5">
                                <li>• Makeup Graduation (SMP-SMK)</li>
                                <li>• Makeup Kondangan & Bridesmaid</li>
                                <li>• Makeup Photoshot & Ibu Hajat</li>
                            </ul>
                        </div>
                        <div class="bg-[#5c4d42] text-white p-4 rounded-2xl shadow-md">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-bold text-cream-card font-serif">PAKET PREMIUM</span>
                                <span class="bg-[#bfa181] text-white text-xs px-2.5 py-1 rounded-full font-bold">Rp 150k - 250k</span>
                            </div>
                            <ul class="text-xs text-cream-card space-y-1.5">
                                <li>• Makeup Lamaran & Akad Nikah</li>
                                <li>• Makeup Wisuda & Yudisium</li>
                                <li>• <strong>Free:</strong> Softlens Normal (Candy/OMG) + Touch Up Kit Mini</li>
                            </ul>
                        </div>
                    </div>`;
            } else if (page === 'booking') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold text-beige-dark mb-4 font-brand">Formulir Booking</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-beige-dark mb-1">Nama Lengkap</label>
                            <input type="text" id="namaKlien" placeholder="Contoh: Sinta Maharani" class="w-full p-3 border border-beige rounded-xl text-sm focus:outline-none focus:border-[#bfa181] bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-beige-dark mb-1">Pilih Paket</label>
                            <select id="pilihPaket" class="w-full p-3 border border-beige rounded-xl text-sm focus:outline-none focus:border-[#bfa181] bg-white">
                                <option value="Reguler (100k-130k)">Paket Reguler (100k - 130k)</option>
                                <option value="Premium (150k-250k)">Paket Premium (150k - 250k)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-beige-dark mb-1">Pilihan Layanan Lokasi</label>
                            <select id="pilihLokasi" class="w-full p-3 border border-beige rounded-xl text-sm focus:outline-none focus:border-[#bfa181] bg-white">
                                <option value="Home Service (Datang ke Lokasi Klien)">Home Service (Datang ke Lokasi Klien)</option>
                                <option value="Datang ke Studio MUA">Datang ke Studio MUA</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-beige-dark mb-1">Pilihan Warna Softlens (Khusus Paket Premium)</label>
                            <select id="pilihSoftlens" class="w-full p-3 border border-beige rounded-xl text-sm focus:outline-none focus:border-[#bfa181] bg-white">
                                <option value="Tidak Ambil / Reguler">Tidak Ambil / Paket Reguler</option>
                                <option value="Candy Brown">Candy Brown</option>
                                <option value="OMG Brown">OMG Brown</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-beige-dark mb-1">Tanggal & Jam Acara</label>
                            <input type="date" id="tglAcara" class="w-full p-3 border border-beige rounded-xl text-sm focus:outline-none focus:border-[#bfa181] bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-beige-dark mb-1">Alamat / Catatan Lokasi</label>
                            <input type="text" id="alamatKlien" placeholder="Contoh: Jl. Sudirman / Kecamatan" class="w-full p-3 border border-beige rounded-xl text-sm focus:outline-none focus:border-[#bfa181] bg-white">
                        </div>
                        
                        <p class="text-[10px] text-gray-500 italic mt-2">*Catatan: Jadwal akan resmi dikunci setelah melakukan pembayaran DP.</p>
                        
                        <button onclick="kirimWhatsApp()" class="w-full beige-btn text-white py-3 rounded-xl font-bold shadow-md mt-2">Kirim Pesanan ke WhatsApp</button>
                    </div>`;
            } else if (page === 'galeri') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold text-beige-dark mb-4 font-brand">Portofolio Makeupbymila</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <!-- Portofolio Make up Akad dari Google Drive -->
                        <div class="h-48 bg-cream-card rounded-2xl border border-beige overflow-hidden shadow-sm flex flex-col">
                            <img src="https://lh3.googleusercontent.com/d/1I4finfpINtf4Ca5HEUt2J-5oSvAmfFH7" alt="Make up Akad" class="w-full h-36 object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                            <div class="p-2 text-center text-xs font-semibold text-beige-dark font-serif">Makeup Akad</div>
                        </div>
                        <div class="h-48 bg-cream-card rounded-2xl border border-beige flex flex-col items-center justify-center text-beige-primary p-2">
                            <i class="fa-solid fa-image text-2xl mb-2"></i>
                            <span class="text-xs font-semibold text-center font-serif">Wisuda / Lainnya</span>
                        </div>
                    </div>`;
            } else if (page === 'produk') {
                content.innerHTML = `
                    <h2 class="text-xl font-bold text-beige-dark mb-2 font-brand">Produk Berkualitas</h2>
                    <p class="text-xs text-beige-primary mb-4">Kami menggunakan produk pilihan yang aman dan berkualitas tinggi:</p>
                    <div class="grid grid-cols-3 gap-2 text-center text-xs">
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">Pramy</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">L'Oreal</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">Wardah</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">Maybelline</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">Esqa</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">Focallure</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">Muaq</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">BLP</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">LT Pro</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">Hada Labo</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">Hojo</div>
                        <div class="p-2 bg-cream-card rounded-lg border border-beige font-bold text-beige-dark">Browit</div>
                    </div>`;
            }
        }

        function kirimWhatsApp() {
            const nama = document.getElementById('namaKlien').value;
            const paket = document.getElementById('pilihPaket').value;
            const lokasi = document.getElementById('pilihLokasi').value;
            const softlens = document.getElementById('pilihSoftlens').value;
            const tgl = document.getElementById('tglAcara').value;
            const alamat = document.getElementById('alamatKlien').value;
            const noWA = "6289609186921";

            if(!nama || !tgl) {
                alert("Mohon isi nama dan tanggal acara terlebih dahulu!");
                return;
            }

            const pesan = `Halo Kak Mila, saya ingin booking makeup.%0A%0A*Nama:* ${nama}%0A*Paket:* ${paket}%0A*Layanan:* ${lokasi}%0A*Softlens:* ${softlens}%0A*Tanggal:* ${tgl}%0A*Alamat/Catatan:* ${alamat}%0A%0AMohon konfirmasinya ya Kak, terima kasih!`;
            window.open(`https://wa.me/${noWA}?text=${pesan}`, '_blank');
        }

        loadPage('home');
    </script>
</body>
</html>
